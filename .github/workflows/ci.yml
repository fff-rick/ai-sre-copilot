name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  proto:
    name: Protobuf drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.7"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.9"
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: uv sync --project services/investigation --frozen --all-groups
      - run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
      - run: go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.1
      - run: make proto-check

  python:
    name: Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/investigation
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.9"
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - run: uv run pytest
      - run: uv build

  stage3-recovery:
    name: Stage 3 recovery
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_DB: ai_sre
          POSTGRES_USER: ai_sre
          POSTGRES_PASSWORD: local-development-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_sre -d ai_sre"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.9"
          enable-cache: true
      - run: uv sync --project services/investigation --frozen --all-groups
      - run: cd services/investigation && uv run ruff format --check ../../scripts/verify-stage3.py ../../evals/run_stage3.py
      - run: cd services/investigation && uv run ruff check ../../scripts/verify-stage3.py ../../evals/run_stage3.py
      - run: make test-stage3-restart
      - run: make eval-stage3-smoke

  stage6-evaluation:
    name: Stage 6 offline quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.9"
          enable-cache: true
      - run: uv sync --project services/investigation --frozen --all-groups
      - run: cd services/investigation && uv run ruff format --check ../../evals/run_stage6.py
      - run: cd services/investigation && uv run ruff check ../../evals/run_stage6.py
      - run: make eval-offline
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage6-evaluation-report
          path: |
            artifacts/stage6-report.json
            artifacts/stage6-report.md
            artifacts/stage6/checkpoints

  stage7-release-candidate:
    name: Stage 7 release candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.9"
          enable-cache: true
      - run: uv sync --project services/investigation --frozen --all-groups
      - run: cd services/investigation && uv run ruff format --check ../../scripts/verify-stage7.py ../../scripts/build-release-manifest.py
      - run: cd services/investigation && uv run ruff check ../../scripts/verify-stage7.py ../../scripts/build-release-manifest.py
      - run: make eval-offline
      - run: make eval-retrieval
      - run: make verify-stage7
      - run: make release-manifest
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage7-release-candidate
          path: |
            artifacts/stage7-acceptance.json
            artifacts/stage7-acceptance.md
            artifacts/release-manifest.json
            artifacts/stage6-report.json
            artifacts/stage6-report.md
            artifacts/stage4-retrieval.json
            artifacts/stage4-retrieval.md

  go:
    name: Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/tool-gateway
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.7"
          cache-dependency-path: services/tool-gateway/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/server

  stage5-remediation:
    name: Stage 5 remediation security
    runs-on: ubuntu-latest
    env:
      STAGE5_DATABASE_URL: postgresql://ai_sre:local-development-only@127.0.0.1:5432/ai_sre
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_DB: ai_sre
          POSTGRES_USER: ai_sre
          POSTGRES_PASSWORD: local-development-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_sre -d ai_sre"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.7"
          cache-dependency-path: services/tool-gateway/go.sum
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.9"
          enable-cache: true
      - uses: helm/kind-action@v1.14.0
        with:
          install_only: true
          version: v0.32.0
      - run: uv sync --project services/investigation --frozen --all-groups
      - run: cd services/investigation && uv run ruff format --check ../../scripts/verify-stage5.py
      - run: cd services/investigation && uv run ruff check ../../scripts/verify-stage5.py
      - name: Initialize phase 5 database schema
        run: psql "$STAGE5_DATABASE_URL" --set ON_ERROR_STOP=on --file deploy/postgres/init.sql
      - run: make test-stage5-kind

  testbed:
    name: Observable testbed
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: testbed
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.7"
          cache-dependency-path: testbed/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/service
      - run: bash -n scripts/*.sh
      - run: docker compose config --quiet

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: "10.33.2"
      - uses: actions/setup-node@v6
        with:
          node-version: "24.20.0"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  compose:
    name: Compose model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose config --quiet
