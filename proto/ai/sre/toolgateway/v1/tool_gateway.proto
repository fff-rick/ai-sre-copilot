syntax = "proto3";

package ai.sre.toolgateway.v1;

option go_package = "ai-sre-copilot.local/tool-gateway/gen/ai/sre/toolgateway/v1;toolgatewayv1";

import "google/protobuf/timestamp.proto";

// ToolGatewayV1 exposes fixed read tools plus approval-gated mutations. The
// mutation RPC accepts only typed operations and revalidates durable approval.
service ToolGatewayV1 {
  rpc ListTools(ListToolsRequest) returns (ListToolsResponse);
  rpc QueryPrometheus(QueryPrometheusRequest) returns (ReadToolResponse);
  rpc QueryLoki(QueryLokiRequest) returns (ReadToolResponse);
  rpc GetTempoTrace(GetTempoTraceRequest) returns (ReadToolResponse);
  rpc SearchTempoTraces(SearchTempoTracesRequest) returns (ReadToolResponse);
  rpc ListReleases(ListReleasesRequest) returns (ReadToolResponse);
  rpc GetGitCommit(GetGitCommitRequest) returns (ReadToolResponse);
  rpc GetKubernetesWorkload(GetKubernetesWorkloadRequest) returns (ReadToolResponse);
  rpc ListKubernetesEvents(ListKubernetesEventsRequest) returns (ReadToolResponse);
  rpc ExecuteApprovedMutation(ExecuteApprovedMutationRequest) returns (MutationExecution);
  rpc GetMutationExecution(GetMutationExecutionRequest) returns (MutationExecution);
}

message CallerIdentity {
  string actor_id = 1;
  string role = 2;
}

message RequestContext {
  string investigation_id = 1;
  string trace_id = 2;
  CallerIdentity caller = 3;
}

message ListToolsRequest { RequestContext context = 1; }

message ToolDescriptor {
  string name = 1;
  string version = 2;
  string description = 3;
}

message ListToolsResponse { repeated ToolDescriptor tools = 1; }

message QueryPrometheusArgs {
  string promql = 1;
  google.protobuf.Timestamp at = 2;
}
message QueryPrometheusRequest {
  RequestContext context = 1;
  QueryPrometheusArgs args = 2;
}

message QueryLokiArgs {
  string logql = 1;
  google.protobuf.Timestamp start = 2;
  google.protobuf.Timestamp end = 3;
  uint32 limit = 4;
  string direction = 5;
}
message QueryLokiRequest {
  RequestContext context = 1;
  QueryLokiArgs args = 2;
}

message GetTempoTraceArgs { string trace_id = 1; }
message GetTempoTraceRequest {
  RequestContext context = 1;
  GetTempoTraceArgs args = 2;
}

message SearchTempoTracesArgs {
  string traceql = 1;
  google.protobuf.Timestamp start = 2;
  google.protobuf.Timestamp end = 3;
  uint32 limit = 4;
}
message SearchTempoTracesRequest {
  RequestContext context = 1;
  SearchTempoTracesArgs args = 2;
}

message ListReleasesArgs {
  string service = 1;
  google.protobuf.Timestamp start = 2;
  google.protobuf.Timestamp end = 3;
  uint32 limit = 4;
}
message ListReleasesRequest {
  RequestContext context = 1;
  ListReleasesArgs args = 2;
}

message GetGitCommitArgs {
  string revision = 1;
  uint32 max_changed_files = 2;
}
message GetGitCommitRequest {
  RequestContext context = 1;
  GetGitCommitArgs args = 2;
}

message GetKubernetesWorkloadArgs {
  string namespace = 1;
  string kind = 2;
  string name = 3;
}
message GetKubernetesWorkloadRequest {
  RequestContext context = 1;
  GetKubernetesWorkloadArgs args = 2;
}

message ListKubernetesEventsArgs {
  string namespace = 1;
  string involved_object_kind = 2;
  string involved_object_name = 3;
  uint32 limit = 4;
}
message ListKubernetesEventsRequest {
  RequestContext context = 1;
  ListKubernetesEventsArgs args = 2;
}

message ArtifactReference {
  string uri = 1;
  string sha256 = 2;
  uint64 size_bytes = 3;
}

message ReadToolResponse {
  string tool_name = 1;
  string source_ref = 2;
  bytes json_payload = 3;
  ArtifactReference artifact = 4;
  bool redacted = 5;
}

message RestartDeploymentArgs {
  string namespace = 1;
  string name = 2;
}

message ScaleDeploymentArgs {
  string namespace = 1;
  string name = 2;
  int32 replicas = 3;
}

message RollbackDeploymentArgs {
  string namespace = 1;
  string name = 2;
  int64 revision = 3;
}

message ExecuteApprovedMutationRequest {
  RequestContext context = 1;
  string approval_token = 2;
  string idempotency_key = 3;
  oneof operation {
    RestartDeploymentArgs restart_deployment = 4;
    ScaleDeploymentArgs scale_deployment = 5;
    RollbackDeploymentArgs rollback_deployment = 6;
  }
}

message GetMutationExecutionRequest {
  RequestContext context = 1;
  string idempotency_key = 2;
}

enum MutationExecutionStatus {
  MUTATION_EXECUTION_STATUS_UNSPECIFIED = 0;
  MUTATION_EXECUTION_STATUS_EXECUTING = 1;
  MUTATION_EXECUTION_STATUS_SUCCEEDED = 2;
  MUTATION_EXECUTION_STATUS_FAILED = 3;
}

message MutationExecution {
  string execution_id = 1;
  string approval_id = 2;
  string investigation_id = 3;
  string tool_name = 4;
  string target = 5;
  string parameters_hash = 6;
  string idempotency_key = 7;
  MutationExecutionStatus status = 8;
  bytes json_payload = 9;
  string safe_error = 10;
  bool replayed = 11;
  google.protobuf.Timestamp started_at = 12;
  google.protobuf.Timestamp finished_at = 13;
}

enum ToolErrorCode {
  TOOL_ERROR_CODE_UNSPECIFIED = 0;
  TOOL_ERROR_CODE_INVALID_ARGUMENT = 1;
  TOOL_ERROR_CODE_UNAUTHENTICATED = 2;
  TOOL_ERROR_CODE_PERMISSION_DENIED = 3;
  TOOL_ERROR_CODE_RATE_LIMITED = 4;
  TOOL_ERROR_CODE_DEADLINE_EXCEEDED = 5;
  TOOL_ERROR_CODE_SOURCE_UNAVAILABLE = 6;
  TOOL_ERROR_CODE_NOT_FOUND = 7;
  TOOL_ERROR_CODE_RESPONSE_TOO_LARGE = 8;
  TOOL_ERROR_CODE_INTERNAL = 9;
  TOOL_ERROR_CODE_CONFLICT = 10;
}

// ToolError is attached as a gRPC rich error detail. Its message is safe for
// callers and never contains credentials or raw upstream response bodies.
message ToolError {
  ToolErrorCode code = 1;
  string safe_message = 2;
  bool retryable = 3;
}
