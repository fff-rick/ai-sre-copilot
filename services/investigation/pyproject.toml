[project]
name = "ai-sre-investigation"
version = "0.1.0"
description = "Evidence-first investigation service for AI-SRE Copilot"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.141,<0.142",
  "grpcio>=1.76,<2",
  "grpcio-status>=1.76,<2",
  "httpx>=0.28,<1",
  "langgraph>=1.2.9,<1.3",
  "langgraph-checkpoint-postgres>=3.0,<4",
  "protobuf>=6.31,<7",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.12,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
ai-sre-ingest = "ai_sre_investigation.ingest:main"

[dependency-groups]
dev = [
  "grpcio-tools>=1.76,<2",
  "httpx>=0.28,<1",
  "mypy>=1.18,<2",
  "pytest>=8.4,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
  "types-grpcio>=1.83.0.20260730",
  "types-grpcio-status>=1.0.0.20260408",
  "types-protobuf>=7.35.1.20260827",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers --cov=ai_sre_investigation --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = ["src/ai_sre_investigation/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["ai_sre_investigation"]
exclude = ["src/ai_sre_investigation/generated"]
