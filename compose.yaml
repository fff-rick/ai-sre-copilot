name: ai-sre-copilot

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_sre}
      POSTGRES_USER: ${POSTGRES_USER:-ai_sre}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  investigation:
    build:
      context: ./services/investigation
    environment:
      AI_SRE_ENVIRONMENT: local
      AI_SRE_DATABASE_URL: postgresql://${POSTGRES_USER:-ai_sre}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-ai_sre}
    ports:
      - "${INVESTIGATION_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  tool-gateway:
    build:
      context: ./services/tool-gateway
    environment:
      SERVER_ADDRESS: ":8081"
    ports:
      - "${TOOL_GATEWAY_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8081/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    build:
      context: ./web
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      investigation:
        condition: service_healthy
      tool-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres-data:
