name: ai-sre-copilot

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_sre}
      POSTGRES_USER: ${POSTGRES_USER:-ai_sre}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 768m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true

  investigation:
    build:
      context: ./services/investigation
    environment:
      AI_SRE_ENVIRONMENT: local
      AI_SRE_DATABASE_URL: postgresql://${POSTGRES_USER:-ai_sre}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-ai_sre}
      AI_SRE_TOOL_GATEWAY_TARGET: tool-gateway:9091
      AI_SRE_TOOL_GATEWAY_TOKEN: ${GATEWAY_AUTH_TOKEN:-local-development-token}
      AI_SRE_MODEL_BASE_URL: ${AI_SRE_MODEL_BASE_URL:-}
      AI_SRE_MODEL_API_KEY: ${AI_SRE_MODEL_API_KEY:-}
      AI_SRE_MODEL_ID: ${AI_SRE_MODEL_ID:-}
      AI_SRE_INVESTIGATION_WORKERS: ${AI_SRE_INVESTIGATION_WORKERS:-5}
      AI_SRE_EMBEDDING_BASE_URL: ${AI_SRE_EMBEDDING_BASE_URL:-}
      AI_SRE_EMBEDDING_API_KEY: ${AI_SRE_EMBEDDING_API_KEY:-}
      AI_SRE_EMBEDDING_MODEL_ID: ${AI_SRE_EMBEDDING_MODEL_ID:-}
      AI_SRE_EMBEDDING_DIMENSIONS: ${AI_SRE_EMBEDDING_DIMENSIONS:-}
      AI_SRE_EVALUATION_REPORT_PATH: /app/artifacts/stage6-report.json
    ports:
      - "${INVESTIGATION_PORT:-8000}:8000"
    volumes:
      - ./artifacts:/app/artifacts:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 768m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true

  tool-gateway:
    build:
      context: ./services/tool-gateway
    environment:
      SERVER_ADDRESS: ":8081"
      GRPC_ADDRESS: ":9091"
      GATEWAY_AUTH_TOKEN: ${GATEWAY_AUTH_TOKEN:-local-development-token}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ai_sre}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-ai_sre}
      MUTATION_ALLOWED_NAMESPACE: ${MUTATION_ALLOWED_NAMESPACE:-ai-sre-test}
      PROMETHEUS_URL: http://host.docker.internal:19090
      LOKI_URL: http://host.docker.internal:13100
      TEMPO_URL: http://host.docker.internal:13200
      RELEASE_EVENTS_FILE: /workspace/testbed/artifacts/fault-events/events.jsonl
      GIT_REPOSITORY_PATH: /workspace
      ARTIFACT_DIRECTORY: /var/lib/ai-sre/artifacts
    ports:
      - "${TOOL_GATEWAY_PORT:-8081}:8081"
      - "${TOOL_GATEWAY_GRPC_PORT:-9091}:9091"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/workspace:ro
      - tool-artifacts:/var/lib/ai-sre/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8081/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 192
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ./web
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      investigation:
        condition: service_healthy
      tool-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 128m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
  tool-artifacts:
